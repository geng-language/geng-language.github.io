<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="preload" href="{{ get_url(path='fonts/space-grotesk-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/geist-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} blog" href="{{ get_url(path='blog/atom.xml') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ get_url(path='/') }}">{{ config.title }}</a>
      <nav class="site-nav">
        {% for item in config.extra.nav %}
        <a href="{{ get_url(path=item.url) }}"{% if current_path and current_path is starting_with(pat=item.url) %} aria-current="page"{% endif %}>{{ item.name }}</a>
        {% endfor %}
        <a href="{{ config.extra.repo_url }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ now() | date(format="%Y") }} The Geng Project</p>
    </div>
  </footer>
</body>
</html>
