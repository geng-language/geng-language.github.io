<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="preload" href="{{ get_url(path='fonts/space-grotesk-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/geist-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      var mode = localStorage.getItem("mode");
      if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-mode", mode);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} blog" href="{{ get_url(path='blog/atom.xml') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ get_url(path='/') }}">{{ config.title }}<span class="brand-tagline">{{ config.extra.tagline }}</span></a>
      <nav class="site-nav">
        {% for item in config.extra.nav %}
        <a href="{{ get_url(path=item.url) }}"{% if current_path and current_path is starting_with(pat=item.url) %} aria-current="page"{% endif %}>{{ item.name }}</a>
        {% endfor %}
        <a href="{{ config.extra.repo_url }}">GitHub</a>
        <button class="mode-switch" type="button" aria-label="Color mode: system" title="Color mode: system">
          <svg data-icon="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          <svg data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ now() | date(format="%Y") }} The Geng Project</p>
    </div>
  </footer>

  <script>
    // Header switch: cycles system -> light -> dark -> system.
    (function () {
      var root = document.documentElement, button = document.querySelector(".mode-switch");
      var next = { auto: "light", light: "dark", dark: "auto" };
      function label(mode) {
        var text = "Color mode: " + (mode === "auto" ? "system" : mode);
        button.setAttribute("aria-label", text);
        button.title = text;
      }
      label(root.getAttribute("data-mode") || "auto");
      button.addEventListener("click", function () {
        var mode = next[root.getAttribute("data-mode") || "auto"];
        if (mode === "auto") root.removeAttribute("data-mode");
        else root.setAttribute("data-mode", mode);
        try {
          if (mode === "auto") localStorage.removeItem("mode");
          else localStorage.setItem("mode", mode);
        } catch (e) {}
        label(mode);
      });
    })();
  </script>
</body>
</html>
