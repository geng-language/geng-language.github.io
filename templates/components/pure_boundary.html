{#- The pure program and the outside world, with @extern and Source as the
    two doors through the boundary. The body is the caption, in Markdown.
    Use it at most once per page: the SVG ids must be unique. -#}
{% component pure_boundary() %}
<figure class="diagram">
<svg viewBox="0 0 720 330" role="img" aria-labelledby="pure-boundary-title pure-boundary-desc" xmlns="http://www.w3.org/2000/svg">
<title id="pure-boundary-title">The pure program and the outside world</title>
<desc id="pure-boundary-desc">A Geng program is one pure space, drawn as an oval holding values, functions, tasks and main. Outside it are timers, events and listeners on the left, and files, the network, the clock and host code on the right. Two doors cross the boundary: Source on the left, where messages come in, and @extern on the right, where tasks call out to host code and get results back.</desc>
<defs>
<marker id="pure-boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0 0L10 5L0 10z"/></marker>
</defs>
<text class="d-muted" x="8" y="22">Outside: effects happen here</text>
<rect class="d-outside" x="8" y="115" width="120" height="110" rx="10"/>
<text class="d-label" x="68" y="143" text-anchor="middle">Events</text>
<text class="d-small" x="68" y="167" text-anchor="middle">timers</text>
<text class="d-small" x="68" y="187" text-anchor="middle">listeners</text>
<text class="d-small" x="68" y="207" text-anchor="middle">messages</text>
<rect class="d-outside" x="592" y="105" width="120" height="130" rx="10"/>
<text class="d-label" x="652" y="133" text-anchor="middle">Host code</text>
<text class="d-small" x="652" y="157" text-anchor="middle">files</text>
<text class="d-small" x="652" y="177" text-anchor="middle">network</text>
<text class="d-small" x="652" y="197" text-anchor="middle">clock</text>
<text class="d-small" x="652" y="217" text-anchor="middle">JS, Erlang, C</text>
<ellipse class="d-pure" cx="360" cy="170" rx="150" ry="140"/>
<text class="d-title" x="360" y="92" text-anchor="middle">Your Geng program</text>
<text class="d-muted" x="360" y="114" text-anchor="middle">everything in here is pure</text>
<rect class="d-chip" x="278" y="138" width="72" height="28" rx="14"/>
<text class="d-small d-on-chip" x="314" y="157" text-anchor="middle">values</text>
<rect class="d-chip" x="360" y="138" width="88" height="28" rx="14"/>
<text class="d-small d-on-chip" x="404" y="157" text-anchor="middle">functions</text>
<rect class="d-chip" x="288" y="178" width="64" height="28" rx="14"/>
<text class="d-small d-on-chip" x="320" y="197" text-anchor="middle">Task</text>
<rect class="d-chip" x="362" y="178" width="72" height="28" rx="14"/>
<text class="d-code d-on-chip" x="398" y="197" text-anchor="middle">main</text>
<text class="d-muted" x="360" y="240" text-anchor="middle">the runtime carries out main</text>
<line class="d-line" x1="130" y1="170" x2="164" y2="170" marker-end="url(#pure-boundary-arrow)"/>
<rect class="d-door" x="168" y="155" width="84" height="30" rx="6"/>
<text class="d-code d-on-door" x="210" y="175" text-anchor="middle">Source</text>
<text class="d-small" x="210" y="205" text-anchor="middle">messages in</text>
<rect class="d-door" x="466" y="155" width="88" height="30" rx="6"/>
<text class="d-code d-on-door" x="510" y="175" text-anchor="middle">@extern</text>
<text class="d-small" x="510" y="205" text-anchor="middle">calls out</text>
<line class="d-line" x1="558" y1="170" x2="588" y2="170" marker-start="url(#pure-boundary-arrow)" marker-end="url(#pure-boundary-arrow)"/>
</svg>
<figcaption>

{{ body | safe }}

</figcaption>
</figure>
{% endcomponent pure_boundary %}
