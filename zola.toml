# Overridden at deploy time by the Pages workflow, so a custom domain
# only needs to be configured in the repo's Pages settings.
base_url = "https://geng-lang.org"
title = "Geng"
description = "The Geng programming language"
default_language = "en"

compile_sass = true
minify_html = false
build_search_index = false

[markdown]
insert_anchor_links = "right"
github_alerts = true
smart_punctuation = true
bottom_footnotes = true

[markdown.highlighting]
error_on_missing_language = true
light_theme = "geng-jade-light"
dark_theme = "geng-jade-dark"
extra_grammars = ["syntaxes/geng.tmLanguage.json"]
extra_themes = ["syntaxes/geng-jade-light.json", "syntaxes/geng-jade-dark.json"]

[extra]
tagline = "Correct by construction. Reliable everywhere."
repo_url = "https://github.com/geng-language"
# Set to true once there is code to see; until then the nav shows GitHub as coming soon.
repo_public = false
nav = [
  { name = "Docs", url = "/docs/" },
  { name = "Reference", url = "/reference/" },
]
